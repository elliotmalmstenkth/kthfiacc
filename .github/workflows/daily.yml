# Archives the Deutsche Börse files (they expire at midnight of the next business day) as draft
# releases and builds the portfolio site on GitHub Pages. See ci.py for the contents.
name: Market data

on:
  schedule:
    # Morning, Tuesday to Saturday: Deutsche Börse lists the finished day's post-trade files (bond trades,
    # Eurex) only after the night, so an evening run found no Eurex files and failed every night.
    - cron: "17 5 * * 2-6"    # main run (07:17 Frankfurt in summer, 06:17 in winter)
    - cron: "47 8 * * 2-6"    # retry the same morning if the main run failed (files stay until midnight)
    - cron: "23 6 * * 0"      # Sunday: FIRDS snapshot (ESMA publishes on Saturdays)
  workflow_dispatch:
    inputs:
      job:
        description: "daily, site or firds"
        default: daily
      days:
        description: "trading days to build, e.g. 2026-10-02 (empty = all completed days without a release)"
        default: ""

permissions:
  contents: write   # releases, data/log.csv and data/history

jobs:
  daily:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '23 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')
    runs-on: ubuntu-latest
    concurrency: { group: marketdata-daily, cancel-in-progress: false }   # one collection run at a time
    timeout-minutes: 300   # downloads are slow from GitHub's IP ranges (~45 min per minute feed)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: FIRDS version
        id: firds
        run: echo "pub=$(python -c 'import firds; print(firds.list_fulins("D")[0])')" >> "$GITHUB_OUTPUT"
      - name: FIRDS cache
        id: firds-cache
        uses: actions/cache@v6
        with:
          path: firds.sqlite
          key: firds-D-${{ steps.firds.outputs.pub }}
      - name: Build FIRDS (once a week)
        if: steps.firds-cache.outputs.cache-hit != 'true'
        run: python firds.py --cat D --db firds.sqlite --folder firds_raw && rm -rf firds_raw
      - name: Fetch, build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
        run: python ci.py --cleanup --firds-db firds.sqlite daily ${DAYS:+--days $DAYS}
      - name: Commit data/log.csv
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data/log.csv: $(tail -n +2 data/log.csv | tail -1 | cut -d, -f1)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

  site:
    needs: daily
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule != '23 6 * * 0' && needs.daily.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'site' || (inputs.job == 'daily' && needs.daily.result == 'success'))))
    runs-on: ubuntu-latest
    concurrency: { group: marketdata-site, cancel-in-progress: true }
    timeout-minutes: 30
    permissions:
      contents: write   # reading draft releases requires write access
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build portfolio site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci.py site --out _site
      - name: Commit data/history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet && exit 0
          git commit -m "data/history: $(ls data/history | tail -1 | cut -c1-10)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

  firds:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'firds')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: FIRDS snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci.py firds
