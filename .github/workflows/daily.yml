# Arkiverar Deutsche Börse-filerna (försvinner vid midnatt nästa bankdag) som utkast-releaser
# och bygger portföljsidan på GitHub Pages. Se ci.py för innehåll.
name: Marknadsdata

on:
  schedule:
    - cron: "37 22 * * 1-5"   # efter handelsdagens sista fil (23:00 Frankfurt)
    - cron: "17 5 * * 1-6"    # reserv: hämtar gårdagen om kvällskörningen missades
    - cron: "23 6 * * 0"      # söndag: FIRDS-ögonblicksbild (ESMA publicerar på lördagar)
  workflow_dispatch:
    inputs:
      job:
        description: "daily, site eller firds"
        default: daily
      days:
        description: "handelsdagar att bygga, t.ex. 2026-10-02 (tomt = alla färdiga som saknas)"
        default: ""

permissions:
  contents: write   # releaser + data/log.csv

jobs:
  daily:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '23 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')
    runs-on: ubuntu-latest
    concurrency: { group: marknadsdata-daily, cancel-in-progress: false }   # en insamling i taget
    timeout-minutes: 300   # nedladdningen är långsam från GitHubs IP-adresser (~45 min per minutflöde)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: FIRDS-version
        id: firds
        run: echo "pub=$(python -c 'import firds; print(firds.list_fulins("D")[0])')" >> "$GITHUB_OUTPUT"
      - name: FIRDS-cache
        id: firds-cache
        uses: actions/cache@v4
        with:
          path: firds.sqlite
          key: firds-D-${{ steps.firds.outputs.pub }}
      - name: Bygg FIRDS (en gång per vecka)
        if: steps.firds-cache.outputs.cache-hit != 'true'
        run: python firds.py --cat D --db firds.sqlite --folder firds_raw && rm -rf firds_raw
      - name: Hämta, bygg och publicera
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
        run: python ci.py --cleanup --firds-db firds.sqlite daily ${DAYS:+--days $DAYS}
      - name: Committa data/log.csv
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data/log.csv: $(tail -n +2 data/log.csv | tail -1 | cut -d, -f1)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

  site:
    needs: daily
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule != '23 6 * * 0' && needs.daily.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'site' || (inputs.job == 'daily' && needs.daily.result == 'success'))))
    runs-on: ubuntu-latest
    concurrency: { group: marknadsdata-site, cancel-in-progress: true }
    timeout-minutes: 30
    permissions:
      contents: write   # utkast-releaser kräver skrivrätt att läsa
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bygg portföljsidan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci.py site --out _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  firds:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'firds')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: FIRDS-ögonblicksbild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci.py firds
