<title>KTH FICC Portfolio</title>
<style>
/* Terminal layout: fixed app shell (header, red function bar, workspace, status line). Each workspace is an
   asymmetric CSS grid of bordered panels that scroll internally, so the book's key numbers stay above the fold.
   Colour roles follow the Bloomberg Terminal: black ground; white numbers; amber only for identifiers (security
   names, codes) and as the fill of small editable fields; grey bands for headers; a red function bar; blue for
   focus/selection; green/red reserved for up/down (blue/red in CVD mode). */
:root {
  --bg: #000000; --panel: #050505; --band: #262626; --band-2: #1a1a1a; --line: #333333; --line-2: #1c1c1c;
  --fg: #e6e6e6; --fg-2: #a6a6a6; --fg-3: #6f6f6f;
  --amber: #f39a1e; --field: #fc9c2a; --field-ink: #000000;
  --red-bar: #b81c26; --red-bar-2: #d52b36; --red-bar-sel: #6e0a10;
  --blue: #2fb5f5; --sel: #12355b; --hover: #161616;
  --pos: #1ee36f; --neg: #ff3b30; --pos-bg: #0b3a1d; --neg-bg: #3f0e0b;
  --mono: "SF Mono", SFMono-Regular, ui-monospace, Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
  color-scheme: dark;
}
:root[data-cvd="1"] { --pos: #3fa9ff; --pos-bg: #0b2a45; }   /* Bloomberg's CVD scheme: blue up, red down */
*, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; box-shadow: none !important; transition: none !important; animation: none !important; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.25 var(--mono); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; font-variant-numeric: tabular-nums; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

/* ---- shell ---- */
.app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; padding-inline: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding-block: 6px; min-width: 0; }
.brand { color: var(--amber); font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand span { color: var(--fg-2); font-weight: 400; }
.stamp { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--fg-3); min-width: 0; }
.stamp b { color: var(--fg); font-weight: 400; }
.acct { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--fg-2); white-space: nowrap; }
.clock { color: var(--fg); }
/* function bar: grey band with a red rule; the active function is the red Bloomberg menu-bar block */
.fkeys { display: flex; gap: 1px; background: var(--band-2); border-bottom: 2px solid var(--red-bar); overflow-x: auto; }
.fkeys button { background: var(--band-2); border: 0; color: var(--fg-2); padding: 4px 14px; cursor: pointer; white-space: nowrap; letter-spacing: .04em; }
.fkeys button:hover { background: #333; color: #fff; }
.fkeys button[aria-selected="true"] { background: var(--red-bar); color: #fff; }
.views { min-height: 0; padding-block: 8px; }
.view { display: grid; gap: 8px; height: 100%; min-height: 0; }
.status { display: flex; flex-wrap: wrap; gap: 2px 18px; align-items: center; border-top: 1px solid var(--line); padding-block: 4px; color: var(--fg-3); min-width: 0; }
.status b { color: var(--fg); font-weight: 400; }
.status .msg { color: var(--amber); }
.status .err { color: var(--neg); }
.status .keys { margin-left: auto; }
.status kbd { color: var(--fg); font: inherit; }

/* ---- panels ---- */
.panel { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 3px 8px; background: var(--band); min-width: 0; }
.ph h2 { margin: 0; font: inherit; font-weight: 700; color: #fff; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.ph .sub { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ph .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pb { flex: 1; min-height: 0; overflow: auto; }
.pad { padding: 8px; }
.note { color: var(--fg-3); margin: 0 0 8px; max-width: 95ch; }
.note b { color: var(--fg-2); font-weight: 400; }

/* ---- KPI strip ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); border: 1px solid var(--line); background: var(--line); gap: 1px; }
.kpi { background: var(--panel); padding: 4px 8px; min-width: 0; }
.kpi .l { color: var(--fg-2); letter-spacing: .06em; font-size: 11px; }
.kpi .v { font-size: 19px; line-height: 1.2; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v.pos { color: var(--pos); } .kpi .v.neg { color: var(--neg); }
.kpi .s { color: var(--fg-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- tables ---- */
table.t { border-collapse: collapse; width: 100%; }
.t th { position: sticky; top: 0; z-index: 1; background: var(--band-2); color: var(--fg-2); font-weight: 400; font-size: 11px; letter-spacing: .03em; text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-2); white-space: nowrap; }
.t td { padding: 2px 6px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); white-space: nowrap; color: var(--fg); }
.t th:last-child, .t td:last-child { border-right: 0; }
.t .n { text-align: right; }
.t th.sort { cursor: pointer; user-select: none; }
.t th.sort:hover { color: #fff; }
.t tbody tr:hover td { background: var(--hover); }
.t tr.click:hover { outline: 1px solid #ffffff; outline-offset: -1px; }        /* Bloomberg: white box = clickable */
.t tbody tr.sel td { background: var(--sel); color: #fff; }
.t tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--blue) !important; }
.t tr.click { cursor: pointer; }
.t td.nm { max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: var(--amber); }   /* identifiers in amber */
.t tbody tr.sel td.nm { color: #ffc56b; }
.t td.amb, .t .amb { color: var(--amber); } .t td.dim { color: var(--fg-2); }
.t td.desc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
.t.vt { table-layout: fixed; min-width: calc(114ch + 189px); }   /* screener: fixed columns */
.t.vt td { overflow: hidden; text-overflow: ellipsis; }
.t.vt td.nm { max-width: none; }
/* column filters: an amber input under each header (Bloomberg SRCH) */
.t.vt tr.cf th { top: var(--hh, 21px); padding: 0; background: var(--field); border-right: 1px solid #b06a00; }
.t.vt tr.cf input { width: 100%; border: 0; padding: 1px 5px; font: inherit; font-size: 12px; background: var(--field); }
.t.vt tr.cf th.n input { text-align: right; }
.t.vt tr.cf input.bad { background: #ff8a8a; }
.t tr.sp td { padding: 0; border: 0; }
.t tbody tr.sp:hover td { background: none; }
.t tfoot td { border-top: 1px solid var(--line); color: #fff; background: var(--band-2); }
.muted { color: var(--fg-3); } .dim { color: var(--fg-2); } .amb { color: var(--amber); } .cy { color: var(--blue); }
.t td.pos, .pos { color: var(--pos); } .t td.neg, .neg { color: var(--neg); }
.tag { display: inline-block; min-width: 3.2em; text-align: center; font-size: 11px; padding: 0 3px; }
.tag.l { background: var(--pos-bg); color: var(--pos); } .tag.s { background: var(--neg-bg); color: var(--neg); }
.ind { color: var(--fg-2); text-decoration: underline dotted; }

/* ---- controls ---- */
a.btn { text-decoration: none; display: inline-block; }
.btn { background: #2e2e2e; border: 1px solid #4a4a4a; color: var(--fg); padding: 1px 9px; cursor: pointer; white-space: nowrap; letter-spacing: .03em; }
.btn:hover { background: #474747; color: #fff; border-color: #6a6a6a; }
.btn.solid { background: #e6e6e6; border-color: #e6e6e6; color: #000; font-weight: 700; }
.btn.solid:hover { background: #ffffff; outline: 1px solid #fff; outline-offset: 1px; }
/* buy/sell: filled = selected side; hover = tint plus the white "clickable" outline, also on the selected side */
.btn.buy { background: #000; border-color: var(--pos); color: var(--pos); } .btn.buy:hover { background: var(--pos-bg); }
.btn.buy[aria-pressed="true"] { background: var(--pos); color: #000; }
.btn.sell { background: #000; border-color: var(--neg); color: var(--neg); } .btn.sell:hover { background: var(--neg-bg); }
.btn.sell[aria-pressed="true"] { background: var(--neg); color: #000; }
.btn.buy:hover, .btn.sell:hover { outline: 1px solid #fff; outline-offset: 1px; }
.btn.x { background: #000; border-color: #5a1a1a; color: var(--neg); padding: 0 6px; }
.btn.x:hover, .btn.x.armed { background: var(--neg); color: #000; border-color: var(--neg); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:disabled:hover { background: #2e2e2e; color: var(--fg); }
/* Bloomberg "amber fields": editable inputs are amber with black text */
input, select { background: var(--field); color: var(--field-ink); border: 1px solid var(--field); padding: 1px 6px; caret-color: #000; }
input:hover, select:hover { border-color: #ffd08a; }
input::placeholder { color: #6b3f00; }
input.num { text-align: right; width: 8.5em; }
input.cmd { background: #000; color: var(--amber); border: 1px solid var(--line); caret-color: var(--amber); }   /* command line */
input.cmd::placeholder { color: var(--fg-3); }
input.cmd:hover { border-color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: 0; }
.chips button, .tog { background: var(--band-2); border: 1px solid var(--line); margin: 0 -1px -1px 0; color: var(--fg-2); padding: 1px 8px; cursor: pointer; white-space: nowrap; }
.chips button::before, .tog::before { content: "\25A1\00A0"; color: var(--fg-3); }            /* Bloomberg-style check boxes */
.chips button:hover, .tog:hover { color: #fff; background: #2a2a2a; }
.chips button[aria-pressed="true"], .tog[aria-pressed="true"] { background: #3b3b3b; color: #fff; border-color: #5a5a5a; }
.chips button[aria-pressed="true"]::before, .tog[aria-pressed="true"]::before { content: "\25A0\00A0"; color: #fff; }
/* asset-class tabs, as in Bloomberg SECF: dark grey tabs, the active tab light grey with black text */
.atabs { display: flex; gap: 1px; padding: 4px 8px 0; border-bottom: 1px solid #9a9a9a; overflow-x: auto; }
.atabs button { background: #2b2b2b; border: 1px solid #3d3d3d; border-bottom: 0; color: var(--fg); padding: 1px 12px; cursor: pointer; white-space: nowrap; letter-spacing: .03em; }
.atabs button:hover { background: #474747; color: #fff; }
.atabs button[aria-selected="true"] { background: #b4b4b4; border-color: #b4b4b4; color: #000; }
.atabs .ct { color: var(--fg-3); margin-left: 6px; }
@media (max-width: 600px) { .atabs button { padding: 1px 7px; } }
.atabs button[aria-selected="true"] .ct { color: #333; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.more { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 3px 8px; border-top: 1px solid var(--line); color: var(--fg-3); }

/* ---- bars / chart ---- */
.bars { display: grid; gap: 3px; padding: 8px; }
.bar { display: grid; grid-template-columns: minmax(80px, 130px) 1fr minmax(64px, auto); gap: 8px; align-items: center; }
.bar .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.bar .tr { height: 9px; position: relative; background: var(--line-2); }
.bar .f { position: absolute; top: 0; bottom: 0; background: #9a9a9a; }
.bar .f.p { background: var(--pos); } .bar .f.n { background: var(--neg); }
.bar .z { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--fg-2); left: 50%; }
.bar .v { text-align: right; color: var(--fg); }
svg.chart { display: block; }
#curveBox { overflow: hidden; }
svg.chart text { fill: var(--fg-3); font: 10px var(--mono); }
svg.chart .grid { stroke: var(--line-2); stroke-width: 1; }
svg.chart .axis { stroke: var(--line); stroke-width: 1; }
svg.chart .curve { fill: none; stroke: #e6e6e6; stroke-width: 1.5; }
svg.chart .dot { fill: var(--amber); stroke: #000; stroke-width: 1; }
svg.chart .dot.short { fill: var(--neg); }
svg.chart .lg { fill: var(--fg-2); }

/* ---- ticket / key-value ---- */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; text-align: right; color: var(--fg); }
.kv dd.big { font-size: 15px; color: #fff; }
.kv dd.big.pos { color: var(--pos); } .kv dd.big.neg { color: var(--neg); }
.sect { border-top: 1px solid var(--line); padding: 8px; display: grid; gap: 6px; }
.sect:first-child { border-top: 0; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lbl { color: var(--fg-2); letter-spacing: .05em; font-size: 11px; }
.empty { padding: 16px 10px; color: var(--fg-2); }
.empty p { margin: 4px 0; max-width: 60ch; }
.empty .hd { color: #fff; }
.who { color: var(--blue); }

/* ---- dialogs & toast ---- */
dialog { background: #000; color: var(--fg); border: 1px solid var(--line); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .75); }
dialog .ph { background: var(--red-bar); } dialog .ph h2 { color: #fff; }
dialog .pb { padding: 10px; display: grid; gap: 8px; }
dialog ol { margin: 0; padding-left: 18px; color: var(--fg-2); display: grid; gap: 3px; }
dialog code { color: var(--amber); }
dialog label { display: grid; gap: 3px; color: var(--fg-2); }
.toast { position: fixed; right: 16px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); background: var(--band); border: 1px solid #5a5a5a; color: #fff; padding: 5px 10px; max-width: calc(100vw - 32px); z-index: 10; }

/* ---- strategy ticket ---- */
.legs { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.leg { background: var(--panel); padding: 3px 6px; display: grid; grid-template-columns: 4.6em 2.6em minmax(0, 1fr) auto; gap: 2px 6px; align-items: center; cursor: pointer; }
.leg:hover { outline: 1px solid #fff; outline-offset: -1px; }
.leg.act { background: var(--sel); box-shadow: inset 3px 0 0 var(--blue); }
.leg .ln { color: var(--fg-3); letter-spacing: .04em; font-size: 11px; }
.leg .nm { color: var(--amber); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leg .s2 { grid-column: 1 / -1; color: var(--fg-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist { min-height: 72px; }
.hist .muted b { color: var(--fg); font-weight: 400; }
svg.spark { display: block; }
svg.spark text { fill: var(--fg-3); font: 10px var(--mono); }
svg.spark .ln { fill: none; stroke: #e6e6e6; stroke-width: 1.25; }
svg.spark .pt { fill: var(--amber); }
svg.spark .base { stroke: var(--line); stroke-width: 1; }
.strat-tag { color: var(--blue); }
.fund { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }

/* ---- market monitor / VaR ---- */
svg.mini { display: inline-block; vertical-align: middle; }
svg.mini polyline { fill: none; stroke: #bdbdbd; stroke-width: 1; }
svg.hist2 rect { fill: #7a7a7a; } svg.hist2 rect.tail { fill: var(--neg); }
svg.hist2 line { stroke: var(--fg-2); stroke-width: 1; } svg.hist2 text { fill: var(--fg-3); font: 10px var(--mono); }
.na { color: var(--fg-3); }

/* ESG labels (Euronext ESG bond list) */
.esg { display: inline-block; margin-left: 5px; padding: 0 3px; font-size: 10px; line-height: 13px; color: #5fd3a0; border: 1px solid #2f7a5a; vertical-align: 1px; }
.esg.slb { color: #a8d8c4; border-color: #4c6b5e; }
.esg.frn { color: #9cc7ff; border-color: #3d5f8a; }
.atabs .ccy { margin-left: auto; align-self: center; }

/* ---- workspace grids ---- */
#v-dash { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas: "kpi kpi kpi" "hold hold mkt" "watch cal expo"; }
#v-hold { grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, .7fr) minmax(0, .6fr);
  grid-template-areas: "kpi kpi kpi" "blot blot blot" "strat perf sum" "attr perf sum"; }
#v-risk { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, .9fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, .8fr) minmax(0, .9fr);
  grid-template-areas: "kpi kpi kpi" "krd hedge var" "cs hedge var" "cty stress meth"; }
#v-guide { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas: "start gloss data" "status status limits"; }
#v-guide .pb { padding: 0; }
#v-guide h3 { font: inherit; color: #fff; letter-spacing: .05em; margin: 10px 0 4px; }
#v-guide ol, #v-guide ul { margin: 0; padding-left: 18px; color: var(--fg); display: grid; gap: 3px; }
.gl { display: grid; grid-template-columns: 10em minmax(0, 1fr); gap: 4px 12px; margin: 0; }
#v-guide .t td { white-space: normal; }
#v-guide .gcols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
#v-guide .gcols > div { min-width: 0; overflow-x: auto; }
@media (max-width: 1000px) { #v-guide .gcols { grid-template-columns: minmax(0, 1fr); } }
.gl dt { color: var(--amber); } .gl dd { margin: 0; color: var(--fg); }
.dqf { color: var(--amber); margin-right: 4px; cursor: help; }
#v-week { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, .8fr) repeat(3, minmax(0, 1fr));
  grid-template-areas: "sum sum club" "new new next" "wide tight iss" "rat rv rv"; }
#v-rates { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, .85fr) minmax(0, 1.15fr);
  grid-template-areas: "gov money" "gov fut"; }
#v-ecb { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "stir" "vol"; }
#v-global { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .85fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "ust cmp emsov" "macro cmp emsov"; }
#v-credit { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); grid-template-rows: minmax(0, .9fr) minmax(0, 1.1fr);
  grid-template-areas: "spreads banks" "sov frn"; }
.volg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.volg > div { min-width: 0; }
.volg > div:first-child { overflow-x: auto; }
.sovg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.sovg > div { min-width: 0; }
@media (max-width: 1000px) { .sovg { grid-template-columns: minmax(0, 1fr); } }
.stirg { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .8fr); height: 100%; }
.stirg > div { min-width: 0; overflow: auto; border-right: 1px solid var(--line-2); }
@media (max-width: 1000px) { .stirg { grid-template-columns: minmax(0, 1fr); height: auto; } }
.t tr.muted td { color: var(--fg-3); }
svg.chart .path { fill: none; stroke: var(--amber); stroke-width: 2; }
svg.chart .eur { fill: #4fa3ff; stroke: #000; stroke-width: .5; }
svg.chart .now { stroke: var(--fg-2); stroke-dasharray: 4 3; }
svg.chart .mtg { stroke: var(--line); }
svg.chart .call { fill: var(--amber); stroke: #000; stroke-width: .5; fill-opacity: .8; }
svg.chart .put { fill: #4fa3ff; stroke: #000; stroke-width: .5; fill-opacity: .8; }
svg.chart .atm { stroke: var(--fg-3); stroke-dasharray: 3 3; }
@media (max-width: 900px) { .volg { grid-template-columns: minmax(0, 1fr); } }
#v-desk { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1.3fr);
  grid-template-areas: "scr tkt" "fut tkt"; }
@media (max-width: 1000px) {
  .app { height: auto; min-height: 100vh; }
  .views { padding-block: 8px 16px; }
  .view { height: auto; grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
  #v-dash { grid-template-areas: "kpi" "hold" "watch" "cal" "mkt" "expo"; }
  #v-hold { grid-template-areas: "kpi" "blot" "strat" "perf" "attr" "sum"; }
  #v-risk { grid-template-areas: "kpi" "krd" "cs" "cty" "stress" "var" "hedge" "meth"; }
  #v-rates { grid-template-areas: "gov" "money" "fut"; }
  #v-ecb { grid-template-areas: "stir" "vol"; }
  #v-credit { grid-template-areas: "spreads" "banks" "sov" "frn"; }
  #v-global { grid-template-areas: "ust" "cmp" "emsov" "macro"; }
  #v-guide { grid-template-areas: "start" "gloss" "data" "status" "limits"; }

<script>
const DATA = /*__DATA__*/null;

// ------------------------------------------------------------------ data
const SECT = { CORP_NONFIN: "Corporates", CORP_FIN: "Financials", COVERED: "Covered", SOV: "Sovereigns",
               SUBSOV: "Sub-sovereigns", AGENCY: "Agencies", SUPRA: "Supranationals" };
// screener tabs by asset class (Bloomberg SECF: Corp, Govt …); s = sectors in the tab
const TABS = [
  { k: "corp", l: "CORP", t: "Corporates: financials and non-financials", s: [["CORP_FIN", "FIN"], ["CORP_NONFIN", "NON-FIN"]] },
  { k: "govt", l: "GOVT", t: "Sovereigns", s: [["SOV", "SOVEREIGNS"]] },
  { k: "ssa", l: "SSA", t: "Supranationals, sub-sovereigns and agencies", s: [["SUPRA", "SUPRA"], ["SUBSOV", "SUB-SOV"], ["AGENCY", "AGENCY"]] },
  { k: "cov", l: "COVERED", t: "Covered bonds (Pfandbriefe, obligations foncières, cédulas …)", s: [["COVERED", "COVERED"]] },
];
const TAB_OF = Object.fromEntries(TABS.flatMap(t => t.s.map(([s]) => [s, t.k])));
const BONDS = DATA.bonds.map(r => Object.fromEntries(DATA.cols.map((c, i) => [c, r[i]])));
const BY_ISIN = new Map(BONDS.map(b => [b.isin, b]));
const FUT = new Map(DATA.futures.map(f => [f.code, f]));
const SETTLE = new Date(DATA.settle + "T12:00:00");
for (const b of BONDS) { b.mid = (b.bid + b.ask) / 2; b.ba = b.bid && b.ask ? b.ask - b.bid : null; b.yrs = (new Date(b.mat + "T12:00:00") - SETTLE) / 3.15576e10; b.ccy ??= "EUR"; }
// Bonds in other currencies: valued in EUR at the ECB reference rates; funded in their own currency, so only the
// P&L, not the principal, carries currency risk (match-funded, as a desk would).
const FX = DATA.mkt?.EURUSD?.v.at(-1) ?? null, SOFR = DATA.mkt?.SOFR?.v.at(-1) ?? null;
// units of each currency per euro (ECB reference rates) and its overnight funding rate
const FXR = { EUR: 1, USD: FX, GBP: DATA.mkt?.EURGBP?.v.at(-1) ?? null, CHF: DATA.mkt?.EURCHF?.v.at(-1) ?? null };
const FUND = { USD: SOFR, GBP: DATA.mkt?.SONIA?.v.at(-1) ?? null, CHF: DATA.mkt?.SARON?.v.at(-1) ?? null };
const FUND_NAME = { EUR: "repo", USD: "SOFR", GBP: "SONIA", CHF: "SARON" };
const HOME = { USD: "US", GBP: "GB", CHF: "CH" };
const CURVE_NAME = { EUR: "ECB AAA", USD: "US Treasury", GBP: "BoE gilt curve", CHF: "Swiss Confederation (fitted)" };
const fxOf = (b) => FXR[b.ccy] ?? null;
const ccyAmt = (b, v, n = 0) => `${b.ccy} ${fmt(v, n)}`;
// no credit risk: euro sovereigns (their spread is a separate VaR factor) and each currency's own government
const noCredit = (b) => b.sector === "SOV" && (b.ccy === "EUR" || b.cty === HOME[b.ccy]);
// rates buckets of the other currencies (VaR factors: their government yields), by modified duration; Swiss franc
// rates have no free daily history, so the euro AAA 10Y stands in for them
const FX_BUCKETS = {
  USD: [["DGS2", "UST 2Y", 0, 3.3], ["DGS5", "UST 5Y", 3.3, 6.2], ["DGS10", "UST 10Y", 6.2, 13], ["DGS30", "UST 30Y", 13, 1e9]],
  GBP: [["GB5", "Gilt 5Y", 0, 6.2], ["GB10", "Gilt 10Y", 6.2, 13], ["GB20", "Gilt 20Y", 13, 1e9]],
  CHF: [["AAA10", "Swiss (proxy: EUR AAA 10Y)", 0, 1e9]],
};
const FX_KEYS = Object.entries(FX_BUCKETS).flatMap(([c, bs]) => bs.map(([k, l, lo, hi]) => [`${c}:${k}`, l, lo, hi, c, k]));
const fxBucket = (ccy, dur) => { const bs = FX_BUCKETS[ccy]; return bs ? `${ccy}:${bs.find(([, , lo, hi]) => dur >= lo && dur < hi)[0]}` : null; };

const nf = (d) => new Intl.NumberFormat("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const F = new Proxy({}, { get: (c, d) => c[d] ??= nf(+d) });
const fmt = (x, d = 2) => x == null || !isFinite(x) ? "–" : F[d].format(x);
const fmtS = (x, d = 0) => x == null || !isFinite(x) ? "–" : (x > 0 ? "+" : "") + F[d].format(x || 0);
const cls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";
const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const dTerm = (s) => { const d = new Date(s + "T12:00:00"); return `${String(d.getDate()).padStart(2, "0")}-${MON[d.getMonth()]}-${d.getFullYear()}`; };
const mmmYY = (s) => { const d = new Date(s + "T12:00:00"); return `${MON[d.getMonth()]}${String(d.getFullYear()).slice(2)}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("ficc." + k)); localStorage.setItem("ficc." + k, JSON.stringify(v)); } catch { return null; } }

// ECB AAA Svensson spot curve (percent, continuously compounded)
const C = DATA.curve;
function spot(m) {
  m = Math.max(m, 1e-6);
  const l = (t) => { const x = m / t; return x < 1e-10 ? 1 : (1 - Math.exp(-x)) / x; };
  const l1 = l(C.t1), l2 = l(C.t2);
  return C.b0 + C.b1 * l1 + C.b2 * (l1 - Math.exp(-m / C.t1)) + C.b3 * (l2 - Math.exp(-m / C.t2));
}
const fwd = (a, b) => (spot(b) * b - spot(a) * a) / (b - a);

// ------------------------------------------------------------------ carry
const DAY = 864e5;
const dParse = (s) => new Date(s + "T12:00:00");
const dIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function addBD(s, n) { const d = dParse(s); while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return dIso(d); }
// coupon schedule rolled back from maturity (ACT/ACT ICMA), as in analytics.py
const CPN_CACHE = new Map();
function couponDates(b) {
  let xs = CPN_CACHE.get(b.isin);
  if (xs) return xs;
  xs = [];
  const m = dParse(b.mat), step = 12 / (b.freq || 1), day = m.getDate();
  for (let k = 0; k < 600; k++) {
    const d = new Date(m.getFullYear(), m.getMonth() - k * step, 1, 12);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    xs.push(d.getTime());
    if (d.getFullYear() < 1990) break;
  }
  xs.reverse(); CPN_CACHE.set(b.isin, xs);
  return xs;
}
function accruedAt(b, s) {
  if (!b.cpn) return 0;
  const t = dParse(s).getTime(), xs = couponDates(b), i = xs.findIndex(x => x > t);
  return i <= 0 ? 0 : b.cpn / (b.freq || 1) * (t - xs[i - 1]) / (xs[i] - xs[i - 1]);
}
const couponsBetween = (b, s0, s1) => { const a = dParse(s0).getTime(), z = dParse(s1).getTime(); return couponDates(b).filter(x => x > a && x <= z).length; };
// longs are funded at the repo rate; shorts lend the sale proceeds at repo less the bond's specialness
const repoRate = (qty, b) => (b && b.ccy !== "EUR" ? (FUND[b.ccy] ?? state.repo) : state.repo) - (qty >= 0 ? 0 : state.special / 100);
// Carry since the trade settled: coupon accrual (and coupons paid) minus funding (ACT/360) on the dirty trade value.
function carryOf(p, b) {
  const s0 = p.settle || addBD(p.date || (p.at || DATA.asof).slice(0, 10), 2), s1 = valSettle();
  const days = (dParse(s1) - dParse(s0)) / DAY;
  if (!(days > 0)) return { cpn: 0, fund: 0, total: 0, days: 0 };
  const cpn = p.qty / 100 * (accruedAt(b, s1) - accruedAt(b, s0) + couponsBetween(b, s0, s1) * b.cpn / (b.freq || 1));
  const fund = -p.qty / 100 * (p.price + accruedAt(b, s0)) * repoRate(p.qty, b) / 100 * days / 360;
  return { cpn, fund, total: cpn + fund, days };
}
// expected carry and roll-down over the next three months (EUR) for qty nominal; roll = yield roll-down along
// the ECB AAA curve plus the issuer's fitted spread curve, at an unchanged curve
function carryRoll3m(b, qty) {
  const dirty = b.mid + b.acc;
  const carry = qty / 100 * (b.cpn * 0.25 - dirty * repoRate(qty, b) / 100 * 91.25 / 360) / fxOf(b);
  const roll = b.roll != null ? qty * dirty / 100 * b.mdur * b.roll * 1e-4 / fxOf(b) : null;
  return { carry, roll };   // EUR
}

// ------------------------------------------------------------------ risk
// DV01/CS01: EUR P&L for a 1 bp fall in yield/spread (positive for a long bond).
const BUCKETS = [["FGBS", "Schatz", 0, 3.3], ["FGBM", "Bobl", 3.3, 6.2], ["FGBL", "Bund", 6.2, 13], ["FGBX", "Buxl", 13, 1e9]];
const bucketOf = (dur) => BUCKETS.find(([, , lo, hi]) => dur >= lo && dur < hi)[0];
const indexDur = (code) => (state.dur[code] ?? FUT.get(code)?.dur ?? null);
// where an index duration comes from: the user's input, the screener estimate (site/build.py) or an assumption
const durSrc = (code) => state.dur[code] != null ? "your input" : FUT.get(code)?.dur_src || "assumed";

function risk(p) {
  if (p.kind === "bond") {
    const b = BY_ISIN.get(p.isin), fx = b && fxOf(b);
    if (!b || !fx) return { missing: true };
    // everything in EUR; FRNs: DV01 from the rates duration (to the next reset), CS01 from the spread duration
    const dirty = b.mid + b.acc, mv = p.qty * dirty / 100 / fx;
    const dv01 = mv * b.mdur * 1e-4, cs01 = noCredit(b) ? 0 : mv * (b.sdur ?? b.mdur) * 1e-4;
    const pnl = p.qty * (b.mid - p.price) / 100 / fx, carry = carryOf(p, b).total / fx;
    return { b, mv, dv01, cs01, pnl, carry, tot: pnl + carry, now: b.mid, y: b.ytm, z: b.z, dur: b.mdur, notional: p.qty, capital: Math.abs(mv) * (b.hc ?? 20) / 100,
             bucket: b.ccy === "EUR" ? bucketOf(b.mdur) : null, ust: b.ccy !== "EUR" ? fxBucket(b.ccy, b.mdur) : null };
  }
  const f = FUT.get(p.code);
  if (!f) return { missing: true };
  // contracts priced in dollars (EUR/USD, the US credit futures) pay their P&L in dollars: converted at the ECB rate
  const fx = FXR[f.ccy] ?? null;
  if (!fx) return { missing: true };
  const notional = p.qty * f.last * f.mult, pnl = p.qty * (f.last - p.price) * f.mult / fx;
  const capital = Math.abs(notional) / fx * futMargin(f) / 100;
  if (f.type === "credit") {
    const d = indexDur(f.code), dv = d ? notional / fx * d * 1e-4 : null;
    return { f, mv: 0, notional, dv01: dv, cs01: dv, pnl, carry: 0, tot: pnl, now: f.last, bucket: d && f.ccy === "EUR" ? bucketOf(d) : null, dur: d, capital };
  }
  return { f, mv: 0, notional, dv01: f.dv01 != null ? p.qty * f.dv01 : null, cs01: 0, pnl, carry: 0, tot: pnl, now: f.last,
           bucket: f.dv01 != null ? f.code : null, y: f.ctd?.ytm, capital };
}

// Capital: bonds tie up their repo haircut (the ECB's for bonds on its list, else an assumption by type, see
// site/build.py); futures their initial margin, approximated in % of contract value (Eurex margins are not in the
// free data). The club's budget is the equity the book may use.
const CAPITAL_BUDGET = 1e6;
const FUT_MARGIN = { FGBS: 0.7, FGBM: 1.5, FGBL: 2.5, FGBX: 5, FBTS: 1.5, FBTP: 4, FOAT: 3, FBON: 3, CONF: 2.5 };
const futMargin = (f) => FUT_MARGIN[f.code] ?? ({ credit: 3, fx: 2.5, vol: 25, equity: 12, govt: 3 }[f.type] ?? 5);

// The whole book in one pass: rows, totals, bucket and sector aggregates. positions: the club's (default) or a
// hypothetical list, for the impact of a trade before it is booked.
function book(positions = state.positions) {
  const rows = positions.map(p => ({ p, r: risk(p) }));
  const ok = rows.filter(x => !x.r.missing);
  const bonds = ok.filter(x => x.p.kind === "bond"), futs = ok.filter(x => x.p.kind !== "bond");
  const mv = bonds.reduce((s, x) => s + x.r.mv, 0);
  const gross = bonds.reduce((s, x) => s + Math.abs(x.r.mv), 0);
  const wavg = (k) => gross > 0 ? bonds.reduce((s, x) => s + Math.abs(x.r.mv) * (x.r[k] ?? 0), 0) / gross : null;   // gross MV weights (longs and shorts)
  const sum = (xs, k) => xs.reduce((s, x) => s + (x.r[k] ?? 0), 0);
  const buck = Object.fromEntries(BUCKETS.map(([c]) => [c, { bonds: 0, futs: 0 }]));
  for (const x of ok) if (x.r.bucket && x.r.dv01) buck[x.r.bucket][x.p.kind === "bond" ? "bonds" : "futs"] += x.r.dv01;
  const ust = Object.fromEntries(FX_KEYS.map(([k]) => [k, 0]));          // other currencies' rates risk, not hedgeable with Bund futures
  for (const x of bonds) if (x.r.ust) ust[x.r.ust] += x.r.dv01;
  const cty = {};                                                       // country of risk (country.py)
  for (const x of bonds) {
    const k = x.r.b.cty || "?", c = cty[k] ??= { mv: 0, gross: 0, dv01: 0, cs01: 0, n: 0 };
    c.mv += x.r.mv; c.gross += Math.abs(x.r.mv); c.dv01 += x.r.dv01; c.cs01 += x.r.cs01; c.n++;
  }
  const sect = {};
  for (const x of bonds) {
    const k = x.r.b.sector, s = sect[k] ??= { mv: 0, dv01: 0, cs01: 0, y: 0, z: 0, n: 0 };
    s.mv += x.r.mv; s.dv01 += x.r.dv01; s.cs01 += x.r.cs01; s.y += x.r.mv * x.r.y; s.z += x.r.mv * (x.r.z ?? 0); s.n++;
  }
  return { rows, ok, bonds, futs, mv, gross, wavg, dv01: sum(ok, "dv01"), cs01: sum(ok, "cs01"), pnl: sum(ok, "pnl"), capital: sum(ok, "capital"),
           carry: sum(ok, "carry"), tot: sum(ok, "tot"), real: state.closed.reduce((s, x) => s + (x.tot || 0), 0),
           futNotional: futs.reduce((s, x) => s + Math.abs(x.r.notional), 0), buck, ust, cty, sect,
           missing: rows.filter(x => x.r.missing).length };
}

// ------------------------------------------------------------------ strategies (pairs and butterflies)
const FUT_DUR = { FGBS: 1.9, FGBM: 4.5, FGBL: 8.5, FGBX: 20 };   // for ordering fly legs only
function legInfo(l) {
  if (!l) return null;
  if (l.kind === "bond") {
    const b = BY_ISIN.get(l.id);
    if (!b) return null;
    return { kind: "bond", id: b.isin, name: b.name, b, dv01: (b.mid + b.acc) / 100 * b.mdur * 1e-4, unit: b.unit || 1000,
             y: b.ytm, z: b.z, rv: b.rv, dur: b.mdur, credit: b.sector !== "SOV" };
  }
  const f = FUT.get(l.id);
  if (!f) return null;
  const d = f.type === "credit" ? indexDur(f.code) : null;
  return { kind: "fut", id: f.code, name: `${f.code} ${mmmYY(f.contract)}`, f, unit: 1, y: f.ctd?.ytm ?? null, z: null, rv: null,
           dv01: f.type === "credit" ? (d ? f.last * f.mult * d * 1e-4 : null) : f.dv01, dur: d ?? FUT_DUR[f.code] ?? null, credit: f.type === "credit" };
}
// Signed leg sizes. Pair: leg 2 is sized to the DV01 of leg 1. Fly: each wing carries half the body's DV01.
// Bonds round to their minimum denomination, futures to whole lots, so a small residual DV01 remains.
function stratLegs() {
  const fly = state.mode === "fly", L = Array.from({ length: fly ? 3 : 2 }, (_, i) => legInfo(state.legs[i]));
  if (L.some(x => !x || !x.dv01)) return { L, ready: false };
  const ai = fly ? 1 : 0, a = L[ai], base = a.kind === "bond" ? state.stratNom : state.stratLots, sA = fly ? state.flyDir : state.pairSide;
  const legs = L.map((x, i) => {
    let q = sA * base;
    if (i !== ai) {
      const t = (fly ? 0.5 : 1) * base * a.dv01 / x.dv01;
      q = -sA * (x.kind === "bond" ? Math.max(x.unit, Math.round(t / x.unit) * x.unit) : Math.max(1, Math.round(t)));
    }
    return { ...x, qty: q, px: x.kind === "bond" ? (q > 0 ? x.b.ask : x.b.bid) : x.f.last };
  });
  const dv = legs.reduce((s, x) => s + x.qty * x.dv01, 0), cs = legs.reduce((s, x) => s + (x.credit ? x.qty * x.dv01 : 0), 0);
  const cost = legs.reduce((s, x) => s + (x.kind === "bond" ? Math.abs(x.qty) * (x.b.ask - x.b.bid) / 2 / 100 : 0), 0);
  const cr = legs.reduce((s, x) => { if (x.kind !== "bond") return s; const c = carryRoll3m(x.b, x.qty); s.carry += c.carry; s.roll += c.roll ?? 0; return s; }, { carry: 0, roll: 0 });
  return { L, legs, ready: base > 0, dv, cs, cost, cr };
}
// Strategy level in bp from leg yields (k = "y") or Z-spreads (k = "z"), legs in slot order with signed qty:
// pair = long leg − short leg, fly = 2 × body − wings.
function levelOf(type, legs, k) {
  const v = legs.map(x => x[k]);
  if (v.length < (type === "fly" ? 3 : 2) || v.some(x => x == null)) return null;
  const m = k === "y" ? 100 : 1;
  if (type === "fly") return (2 * v[1] - v[0] - v[2]) * m;
  return (legs[0].qty > 0 ? v[0] - v[1] : v[1] - v[0]) * m;
}
// pairs profit when the level falls; a fly with a long body profits when it falls, a short body when it rises
const profitsIf = (type, legs) => type === "fly" && legs[1]?.qty < 0 ? "rises" : "falls";
function strategies(bk) {
  const m = new Map();
  for (const x of bk.rows) { const s = x.p.strat; if (s) (m.get(s.id) || m.set(s.id, { ...s, rows: [] }).get(s.id)).rows.push(x); }
  return [...m.values()].map(g => {
    g.rows.sort((a, b) => (a.p.strat.leg ?? 0) - (b.p.strat.leg ?? 0));
    const ok = g.rows.filter(x => !x.r.missing), sum = (k) => ok.reduce((s, x) => s + (x.r[k] ?? 0), 0);
    const legs = g.rows.map(x => ({ qty: x.p.qty, y: x.r.y ?? null, z: x.p.kind === "bond" ? x.r.z ?? null : null,
                                    hid: x.p.kind === "bond" ? x.p.isin : "FUT:" + x.p.code }));
    return { ...g, legs, pnl: sum("pnl"), carry: sum("carry"), tot: sum("tot"), dv01: sum("dv01"), cs01: sum("cs01"),
             y: levelOf(g.type, legs, "y"), z: levelOf(g.type, legs, "z") };
  });
}

// ------------------------------------------------------------------ history
// hist/<n>.json shards (site/build.py): {d: [dates], s: {id: [[mid, ytm, z, rv] or null]}}; FNV-1a picks the shard.
const HIST = new Map();
const fnv = (k) => { let h = 2166136261; for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h % 256; };
async function histOf(id) {
  if (!DATA.hist) return null;
  const n = fnv(id);
  if (!HIST.has(n)) HIST.set(n, fetch(`hist/${n}.json`).then(r => r.ok ? r.json() : null).catch(() => null));
  const sh = await HIST.get(n);
  if (!sh) return null;
  const xs = sh.s[id] || [];
  return sh.d.map((d, i) => ({ d, v: xs[i] })).filter(x => x.v);
}
const HK = { mid: 0, y: 1, z: 2, rv: 3 };
// level series of a strategy: dates where every leg has a value

// ------------------------------------------------------------------ value at risk
// Historical simulation over the last 500 daily changes of the risk factors (market.py):
//   rates   ECB AAA spot 2Y/5Y/10Y/30Y, one per futures bucket: P&L = −DV01(bucket) × Δy
//   credit  ICE BofA Euro HY OAS. Spreads move in proportion to their level (duration times spread, DTS):
//           a position's spread changes by ΔHY × spread / HY, so P&L = −CS01 × spread / HY × ΔHY
//   sov.    non-AAA sovereign spread: Δ(all-govt 10Y − AAA 10Y), scaled the same way by the bond's Z-spread
//   dollar  US Treasury 2Y/5Y/10Y/30Y for the dollar bonds' DV01 by bucket, and the ICE BofA US HY OAS (DTS as above)
//           for their credit; the currency is not a factor, as dollar positions are funded in dollars
const VAR_N = 500, BUCKET_TENOR = { FGBS: "AAA2", FGBM: "AAA5", FGBL: "AAA10", FGBX: "AAA30" };
let VAR_S;
function varScenarios() {
  if (VAR_S !== undefined) return VAR_S;
  const M = DATA.mkt || {};
  if (!Object.values(BUCKET_TENOR).every(k => M[k])) return (VAR_S = null);
  const ff = (s) => { if (!s) return null; const m = new Map(s.d.map((d, i) => [d, s.v[i]])); let last = null; return (d) => (m.has(d) ? (last = m.get(d)) : last); };
  const dates = M.AAA10.d, hy = ff(M.BAMLHE00EHYIOAS), all10 = ff(M.ALL10);
  const lv = Object.fromEntries(Object.entries(BUCKET_TENOR).map(([c, k]) => [c, ff(M[k])]));
  // dollar factors: US Treasury yields by bucket and the ICE BofA US HY OAS (on the euro dates; last value carried)
  const ust = Object.fromEntries(FX_KEYS.map(([k, , , , , s]) => [k, ff(M[s])])), ushy = ff(M.BAMLH0A0HYM2);
  const rows = dates.map(d => ({ d, y: Object.fromEntries(Object.keys(BUCKET_TENOR).map(c => [c, lv[c](d)])), hy: hy?.(d) ?? null, sov: all10 && all10(d) != null ? all10(d) - lv.FGBL(d) : null,
    us: Object.fromEntries(FX_KEYS.map(([k]) => [k, ust[k]?.(d) ?? null])), ushy: ushy?.(d) ?? null }));
  const out = { dates: [], dy: Object.fromEntries(Object.keys(BUCKET_TENOR).map(c => [c, []])), dhy: [], dsov: [],
                dus: Object.fromEntries(FX_KEYS.map(([k]) => [k, []])), dushy: [] };
  const chg = (a, b) => a != null && b != null ? (b - a) * 100 : 0;
  for (let i = Math.max(1, rows.length - VAR_N); i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i];
    out.dates.push(b.d);
    for (const c in BUCKET_TENOR) out.dy[c].push((b.y[c] - a.y[c]) * 100);
    out.dhy.push(chg(a.hy, b.hy));
    out.dsov.push(chg(a.sov, b.sov));
    for (const [k] of FX_KEYS) out.dus[k].push(chg(a.us[k], b.us[k]));
    out.dushy.push(chg(a.ushy, b.ushy));

  out.ushyNow = last.ushy != null ? last.ushy * 100 : null;
  out.hyNow = last.hy != null ? last.hy * 100 : null;          // bp
  out.sovNow = last.sov != null ? last.sov * 100 : null;       // bp
  out.igRatio = M.BAMLC0A0CM && M.BAMLH0A0HYM2 ? M.BAMLC0A0CM.v.at(-1) / M.BAMLH0A0HYM2.v.at(-1) : 0.3;

}
function varOf(bk) {
  const S = varScenarios();
  if (!S || !S.dates.length) return null;
  const dv = Object.fromEntries(Object.keys(BUCKET_TENOR).map(c => [c, bk.buck[c].bonds + bk.buck[c].futs]));
  let dts = 0, sov = 0, dtsUs = 0;
  for (const x of bk.bonds) {
    if (x.r.b.ccy === "USD") { if (x.r.cs01 && S.ushyNow) dtsUs += x.r.cs01 * Math.max(x.r.z ?? 0, 10) / S.ushyNow; }
    else if (x.r.cs01 && S.hyNow) dts += x.r.cs01 * Math.max(x.r.z ?? 0, 10) / S.hyNow;
    else if (x.r.b.sector === "SOV" && S.sovNow > 1 && (x.r.z ?? 0) > 10) sov += x.r.dv01 * x.r.z / S.sovNow;
  }
  for (const x of bk.futs) if (x.r.f?.type === "credit" && x.r.cs01 && S.hyNow) dts += x.r.cs01 * (/HY/.test(x.r.f.code) ? 1 : S.igRatio);

    for (const [k] of FX_KEYS) r -= bk.ust[k] * S.dus[k][t];
    const cr = -dts * S.dhy[t] - sov * S.dsov[t] - dtsUs * S.dushy[t];

}

    bins.map((c, i) => `<rect class="${lo + (i + 1) * w <= cut ? "tail" : ""}" x="${(L + i * bw).toFixed(1)}" y="${(T + (1 - c / mx) * (H - T - B)).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${(c / mx * (H - T - B)).toFixed(1)}"/>`).join("") +
    `<line x1="${X(cut)}" x2="${X(cut)}" y1="${T}" y2="${H - B}"/><text x="${X(cut) + 3}" y="${T + 8}">VaR99</text>` +
    `<text x="${L}" y="${H - 3}">${fmtS(lo, 0)}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">${fmtS(hi, 0)}</text></svg>`;

// Hedge: credit first (credit futures carry spread and rate duration), then rates on the residual DV01 per bucket.
function hedgeCalc(bk) {
  const corpCs = bk.bonds.filter(x => x.r.b.sector.startsWith("CORP") && x.r.b.ccy === "EUR").reduce((s, x) => s + x.r.cs01, 0)
               + bk.futs.filter(x => x.r.f?.type === "credit").reduce((s, x) => s + (x.r.cs01 ?? 0), 0);
  const cf = FUT.get(state.hedgeIdx), cd = indexDur(state.hedgeIdx);
  const csPer = cf && cd ? cf.last * cf.mult * cd * 1e-4 : null;
  const nCredit = csPer && state.hedgePct ? Math.round(-corpCs * state.hedgePct / 100 / csPer) || 0 : 0;
  const pre = Object.fromEntries(BUCKETS.map(([c]) => [c, bk.buck[c].bonds + bk.buck[c].futs]));
  if (nCredit && csPer) pre[bucketOf(cd)] += nCredit * csPer;
  const rateTrades = BUCKETS.map(([c, l]) => { const f = FUT.get(c); const n = f?.dv01 ? Math.round(-pre[c] / f.dv01) || 0 : 0; return { c, l, f, dv: pre[c], n }; });
  const trades = [...(nCredit ? [{ code: state.hedgeIdx, n: nCredit }] : []), ...rateTrades.filter(t => t.n).map(t => ({ code: t.c, n: t.n }))];
  const after = rateTrades.reduce((s, t) => s + t.dv + t.n * (t.f?.dv01 || 0), 0);
  return { corpCs, csPer, nCredit, rateTrades, trades, after, cd };
}

// ------------------------------------------------------------------ GitHub storage
// The portfolio is portfolio/positions.json in the repo: open positions and closed trades. Anyone can read it;
// collaborators with write access save with a personal GitHub token (kept only in this browser).
const REPO = DATA.repo;
const API = `https://api.github.com/repos/${REPO.owner}/${REPO.name}`;
const FILE = `${API}/contents/${REPO.path}`;
const HISTORY = `https://github.com/${REPO.owner}/${REPO.name}/commits/${encodeURIComponent(REPO.branch)}/${REPO.path}`;
const utf8ToB64 = (str) => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64ToUtf8 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const gh = {
  token: store("ghToken"), login: store("ghLogin"), sha: null,
  headers(json) { const h = { Accept: "application/vnd.github+json" }; if (this.token) h.Authorization = "Bearer " + this.token; if (json) h["Content-Type"] = "application/json"; return h; },
  async load() {
    const r = await fetch(`${FILE}?ref=${encodeURIComponent(REPO.branch)}`, { headers: this.headers(), cache: "no-store" });
    if (r.status === 404) { this.sha = null; return { positions: [], closed: [], orders: [] }; }
    if (!r.ok) throw Object.assign(new Error("load " + r.status), { status: r.status });
    const j = await r.json();
    this.sha = j.sha;
    const d = JSON.parse(b64ToUtf8(j.content));
    return { positions: d.positions || [], closed: d.closed || [], orders: d.orders || [] };
  },
  // mutate({positions, closed}) -> the new file contents. If someone else saved in between (409), reload the file and re-apply.
  async save(mutate, message) {
    for (let attempt = 0; ; attempt++) {
      const next = mutate(await this.load());
      const body = { message, branch: REPO.branch, content: utf8ToB64(JSON.stringify({ positions: next.positions, closed: next.closed, orders: next.orders || [] }, null, 1) + "\n") };
      if (this.sha) body.sha = this.sha;
      const r = await fetch(FILE, { method: "PUT", headers: this.headers(true), body: JSON.stringify(body) });
      if (r.ok) { this.sha = (await r.json()).content.sha; return next; }
      if ((r.status === 409 || r.status === 422) && attempt < 3) continue;
      throw Object.assign(new Error("save " + r.status), { status: r.status });
    }
  },
  // Checks the token: whose it is and whether that account can push to the repo.
  async check(token) {
    const h = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
    const u = await fetch("https://api.github.com/user", { headers: h });
    if (!u.ok) return { error: "GitHub rejected the token. Check that you copied all of it." };
    const login = (await u.json()).login;
    const rr = await fetch(API, { headers: h });
    const push = rr.ok ? !!(await rr.json()).permissions?.push : false;
    return { login, push };
  },
};

function describe(p) {
  if (!p) return "position";
  if (p.kind === "bond") return `${p.qty >= 0 ? "buy" : "sell"} ${BY_ISIN.get(p.isin)?.ccy || "EUR"} ${fmt(Math.abs(p.qty), 0)} ${BY_ISIN.get(p.isin)?.name || p.isin}`;
  return `${p.qty >= 0 ? "buy" : "sell"} ${Math.abs(p.qty)} ${p.code} ${(p.contract || "").slice(0, 7)}`;
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function addPositions(list, label = "") {
  if (!state.canWrite) { openLogin(); return false; }
  const rows = list.map(p => ({ id: newId(), ...p, date: tradeDay(), by: gh.login, at: new Date().toISOString() }));
  try {
    setDoc(await gh.save(d => ({ ...d, positions: [...d.positions, ...rows] }), `Portfolio: ${label ? label + ": " : ""}${rows.map(describe).join(", ")} (${gh.login})`));
    render(); return true;
  } catch (e) { writeError(e); return false; }
}
const setDoc = (d) => { state.positions = d.positions; state.closed = d.closed; state.orders = d.orders || []; };
// Closing trades out of the position: a long is sold at the bid, a short bought back at the offer (one-sided
// quote: the mid), a future at the last price. The trade moves to the closed list with its realized P&L,
// clean P&L at the exit price plus carry up to the close.
function closeRec(p) {
  const r = risk(p), rec = { ...p, closed: tradeDay(), closedAt: new Date().toISOString(), closedBy: gh.login };
  const r2 = (v) => Math.round(v * 100) / 100;
  if (r.missing) return { ...rec, exit: null, pnl: 0, carry: 0, tot: 0 };
  const exit = p.kind === "bond" ? (p.qty >= 0 ? r.b.bid : r.b.ask) || r.b.mid : r.f.last;
  const pnl = p.kind === "bond" ? p.qty * (exit - p.price) / 100 / fxOf(r.b) : p.qty * (exit - p.price) * r.f.mult / (FXR[r.f.ccy] || 1);   // EUR
  const carry = p.kind === "bond" ? r.carry : 0;
  return { ...rec, exit, pnl: r2(pnl), carry: r2(carry), tot: r2(pnl + carry) };
}
// Limit orders: stored in the portfolio file and matched each evening against the day's minute files (orders.py).
// A limit that can trade now (a buy at or above the offer, a sell at or below the bid) is executed at once.
function orderDay() {   // the first trading day an order placed now can work: today before the 17:30 close, else the next
  const now = new Date(), fr = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Berlin" }));
  const d = dIso(fr), open = fr.getDay() % 6 && (fr.getHours() * 60 + fr.getMinutes()) < 17 * 60 + 30;
  return open ? d : addBD(d, 1);
}

async function closeWhere(pred, what, btn) {
  const recs = state.positions.filter(pred).map(closeRec), tot = recs.reduce((s, x) => s + x.tot, 0);
  try {
    // re-price against the file as saved (someone may have changed it), at the prices shown now
    setDoc(await gh.save(d => ({ ...d, positions: d.positions.filter(x => !pred(x)), closed: [...d.closed, ...d.positions.filter(pred).map(closeRec)] }),
      `Portfolio: close ${what}, realized ${fmtS(tot, 0)} EUR (${gh.login})`));
    if (state.stratSel && !state.positions.some(x => x.strat?.id === state.stratSel)) state.stratSel = null;
    render(); toast(`Closed: realized ${fmtS(tot, 0)} EUR`);
  } catch (e) { if (btn) btn.disabled = false; writeError(e); }
}
const closePosition = (id, btn) => {
  const pos = state.positions.find(x => x.id === id), x = pos && closeRec(pos);

function writeError(e) {

// ------------------------------------------------------------------ intraday prices (live.py -> branch 'live')
// Every minute GitHub Actions pushes the latest Deutsche Börse minute file's quotes as live.json, the only
// file on the branch 'live'. The page reads the branch head's commit id from the GitHub API and fetches the
// file by that id from raw.githubusercontent.com, which is a new URL each minute (no stale CDN copy).
const LIVE = { sha: null, data: null, raw: null, err: null, checked: null };
const tradeDay = () => LIVE.data?.day || DATA.asof;
const valSettle = () => LIVE.data ? addBD(LIVE.data.day, 2) : DATA.settle;
const utcToCet = (s) => s && isFinite(Date.parse(s.endsWith("Z") ? s : s + "Z")) ? new Date(s.endsWith("Z") ? s : s + "Z").toLocaleTimeString("en-GB", { timeZone: "Europe/Berlin", hour12: false, hour: "2-digit", minute: "2-digit" }) : "–";
function applyLive(j) {
  if (!j || !j.day || j.day <= DATA.asof) return false;   // the evening build already covers this day
  LIVE.data = j;
  for (const [isin, q] of Object.entries(j.bonds || {})) {
    const b = BY_ISIN.get(isin);
    if (!b) continue;
    b.eod ??= { mid: b.mid, ytm: b.ytm, z: b.z };
    const [bid, ask, bq, aq, t] = q;
    if (bid == null || ask == null || ask < bid) continue;   // one-sided now: keep the last two-way mark
    Object.assign(b, { bid, ask, mid: (bid + ask) / 2, ba: ask - bid, firm: bq > 0 && aq > 0 ? 1 : 0, live: t });
    // first-order repricing from the end-of-day analytics: Δy = −Δprice / (dirty × modified duration);
    // an FRN's price moves with its discount margin, so its spread duration is used
    const dy = -(b.mid - b.eod.mid) / (b.eod.mid + b.acc) / (b.sdur ?? b.mdur) * 100;
    b.ytm = b.eod.ytm + dy;
    if (b.eod.z != null) b.z = b.eod.z + dy * 100;
  }
  for (const [code, x] of Object.entries(j.fut || {})) {
    const f = FUT.get(code);
    if (f && x[0] === f.contract) Object.assign(f, { last: x[1], high: x[2], low: x[3], trades: x[4], lots: x[5], live: x[6] });
  }
  return true;
}
async function pollLive() {
  if (!document.hidden) {
    try {
      const r = await fetch(`${API}/git/ref/heads/live`, { headers: gh.headers(), cache: "no-store" });
      if (r.ok) {
        const sha = (await r.json()).object.sha;
        if (sha !== LIVE.sha) {
          const j = await (await fetch(`https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${sha}/live.json`)).json();
          LIVE.sha = sha; LIVE.raw = j;
          if (applyLive(j)) {
            DRAWN = "";
            if (!document.activeElement?.closest?.("input, select, textarea")) render(); else renderStatus();
          }
        }
        LIVE.err = null;
      } else LIVE.err = r.status === 404 ? "no feed published yet" : r.status === 403 ? "GitHub rate limit, sign in for more" : `GitHub ${r.status}`;
    } catch { LIVE.err = "network error"; }
    LIVE.checked = new Date();
    renderStamp(); renderStatus();
  }
  // signed in: 5,000 GitHub API calls an hour; anonymous: 60, shared with loading the book
  setTimeout(pollLive, (gh.token ? 60 : 120) * 1000);
}

// the feed runs on business days 07:45-17:45 Frankfurt time (live.py)
function feedOpen() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const hm = `${p.hour}:${p.minute}`;
  return !["Sat", "Sun"].includes(p.weekday) && hm >= "07:45" && hm < "17:45";
}
const tsMs = (iso) => { const t = Date.parse(iso || ""); return isFinite(t) ? t : null; };   // null for a missing or malformed time
const ago = (iso) => {
  const t = tsMs(iso);
  if (t == null) return null;
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 1 ? "just now" : m < 120 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
};
function renderStamp() {
  const L = LIVE.data, R = LIVE.raw, open = feedOpen();
  const px = L
    ? `<span>PX <b>BÖRSE FRANKFURT ${dTerm(L.day)} ${utcToCet(L.msg)} CET</b> intraday, delayed</span>`
    : `<span>PX <b>BÖRSE FRANKFURT ${dTerm(DATA.asof)}</b> close (last two-way before 17:30 CET)</span>`;
  const stale = R && open && (Date.now() - (tsMs(R.gen) ?? 0)) / 60000 > 5;   // no valid publish time counts as stale
  const state = !LIVE.checked ? `<span class="muted">checking…</span>`
    : LIVE.err && !R ? `<span class="neg">UNAVAILABLE</span> <span class="muted">${esc(String(LIVE.err))}</span>`
    : stale ? `<span class="neg">STALE</span>`
    : L ? `<span class="pos">LIVE</span>`
    : `<span class="muted">${open ? "WAITING FOR TODAY'S FIRST FILE" : "MARKET CLOSED"}</span>`;
  const pub = R ? ago(R.gen) : null;
  const last = R ? `${R.msg ? ` · latest quote <b>${dTerm(R.day)} ${utcToCet(R.msg)} CET</b>` : ""}${pub ? ` · published ${pub}` : ""}` : "";
  const feed = `<span title="Deutsche Börse minute files via GitHub Actions; the page checks every ${gh.token ? 1 : 2} min">FEED ${state}${last}${LIVE.checked ? ` · checked ${LIVE.checked.toLocaleTimeString("en-GB", { hour12: false })}` : ""}</span>`;
  $("#stamp").innerHTML = px + feed + `<span>SETTLE <b>${dTerm(valSettle())}</b> T+2</span>` + `<span>CURVE <b>ECB AAA ${dTerm(DATA.curve.date)}</b></span>`;
}

function bars(items, fmtv, kind = "amber") {

function curveChart(bk, W = 600, H = 230) {
  const L = 38, R = 12, T = 10, B = 22;
  const pts = bk.bonds.filter(x => x.r.b.ccy === "EUR" && x.r.b.frn == null && x.r.y != null && x.r.y > -2 && x.r.y < 20).map(x => ({ x: Math.min(x.r.b.yrs, 30), y: x.r.y, s: x.p.qty < 0, n: x.r.b.name }));
  const xs = Array.from({ length: 121 }, (_, i) => 0.25 + i * (29.75 / 120));
  const ys = xs.map(spot);
  let lo = Math.min(...ys, ...pts.map(p => p.y)), hi = Math.max(...ys, ...pts.map(p => p.y));
  const pad = (hi - lo) * 0.12 || 0.5; lo = Math.floor((lo - pad) * 4) / 4; hi = Math.ceil((hi + pad) * 4) / 4;
  const X = (x) => L + x / 30 * (W - L - R), Y = (y) => T + (hi - y) / (hi - lo) * (H - T - B);
  const step = (hi - lo) > 3 ? 1 : 0.5;
  let g = "";
  for (let y = Math.ceil(lo / step) * step; y <= hi + 1e-9; y += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L - 4}" y="${Y(y) + 3}" text-anchor="end">${fmt(y, step < 1 ? 1 : 0)}</text>`;
  for (const x of [0, 2, 5, 10, 20, 30]) g += `<line class="grid" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H - B}"/><text x="${X(x)}" y="${H - B + 13}" text-anchor="middle">${x}Y</text>`;
  const path = xs.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join("");
  const dots = pts.map(p => `<circle class="dot${p.s ? " short" : ""}" cx="${X(p.x)}" cy="${Y(p.y)}" r="4"><title>${esc(p.n)}: YTM ${fmt(p.y, 2)}% at ${fmt(p.x, 1)}y</title></circle>`).join("");
  const lg = `<text class="lg" x="${W - R - 4}" y="${T + 10}" text-anchor="end">— ECB AAA SPOT   ● LONG   <tspan fill="var(--neg)">●</tspan> SHORT</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="ECB AAA spot curve with holdings yields">${g}${lg}<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><path class="curve" d="${path}"/>${dots}</svg>`;
}

// The club book over time (site/build.py pnl_history): clean P&L of the open positions at each evening's marks plus
// realized P&L, against the FECX index (the Eurex future on euro IG corporates) as the benchmark.
function perfPanel() {
  const H = DATA.pnlh;
  if (!H || !H.d.length) return `<div class="empty">No history yet: the series starts with the first evening build after the first trade.</div>`;
  const n = H.d.length, pnl = H.pnl, gross = H.gross.filter(g => g > 0), avgG = gross.length ? gross.reduce((a, b) => a + b, 0) / gross.length : null;
  const daily = pnl.map((v, i) => i ? v - pnl[i - 1] : v);
  let peak = -Infinity, dd = 0; for (const v of pnl) { peak = Math.max(peak, v); dd = Math.min(dd, v - peak); }
  const mean = daily.reduce((a, b) => a + b, 0) / n, sd = Math.sqrt(daily.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, n - 1));
  const ret = H.twr ? H.twr.at(-1) : avgG ? pnl.at(-1) / avgG * 100 : null, bench = H.bench.at(-1);
  const best = Math.max(...daily), worst = Math.min(...daily);
  return `<div class="sect"><div class="lbl">BOOK P&amp;L, EUR (CLEAN + REALIZED)</div><div class="hist" id="perfHist"></div></div>
    <dl class="kv pad"><dt>Days</dt><dd>${n} (${dTerm(H.d[0])} – ${dTerm(H.d.at(-1))})</dd><dt>P&amp;L</dt><dd class="${cls(pnl.at(-1))}">${fmtS(pnl.at(-1), 0)} EUR</dd>
      <dt title="time-weighted: each day's P&L over the bonds held that day, chained, so buying or selling does not move it">Return (time-weighted)</dt><dd class="${cls(ret)}">${ret == null ? "–" : fmtS(ret, 2) + "%"}</dd>
      <dt title="the FECX future's price change over the same days">FECX index</dt><dd class="${cls(bench)}">${bench == null ? "–" : fmtS(bench, 2) + "%"}</dd>
      <dt title="time-weighted return minus the index">Excess return</dt><dd class="${cls(ret - bench)}">${ret == null || bench == null ? "–" : fmtS(ret - bench, 2) + "%"}</dd>
      <dt title="mean daily P&L / its standard deviation × √252; shown from 10 days">Sharpe ratio</dt><dd>${n >= 10 && sd > 0 ? fmt(mean / sd * Math.sqrt(252), 2) : "– (needs 10 days)"}</dd>
      <dt>Max drawdown</dt><dd class="${cls(dd)}">${fmtS(dd, 0)} EUR</dd><dt>Best / worst day</dt><dd>${fmtS(best, 0)} / ${fmtS(worst, 0)}</dd></dl>
    <p class="note pad">A fund like AMF's is judged against an index, not in euros: excess return and drawdown are the numbers to beat. Carry is left out of the history; the evening marks are mids.</p>`;
}

// ------------------------------------------------------------------ watchlist and alerts
// Per viewer (browser storage): a level to watch on a bond (Z-spread, yield, price), a future (price) or a euro
// credit segment (median Z). Triggered alerts are listed first and announced once per visit.
const WF = { z: "Z / DM bp", ytm: "YTM %", mid: "price", last: "price", idx: "median Z bp" };
function watchVal(w) {
  if (w.kind === "bond") { const b = BY_ISIN.get(w.id); return b ? b[w.f] : null; }
  if (w.kind === "fut") return FUT.get(w.id)?.last ?? null;
  return DATA.idx?.[w.id]?.z ?? null;
}
const watchName = (w) => w.kind === "bond" ? (BY_ISIN.get(w.id)?.name || w.id) : w.kind === "fut" ? w.id : (DATA.idx?.[w.id]?.name || w.id);
const watchHit = (w) => { const v = watchVal(w); return v != null && (w.op === ">" ? v > w.lv : v < w.lv); };
function watchPanel() {
  const W = state.watch;
  const idxOpts = Object.entries(DATA.idx || {}).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join("");
  const add = `<div class="row pad"><span class="lbl">SEGMENT</span><select id="wIdx">${idxOpts}</select><select id="wOp"><option>&gt;</option><option>&lt;</option></select>
    <input id="wLv" class="num" style="width:6em" placeholder="bp" inputmode="decimal"><button class="btn" id="wAdd">ADD</button><span class="muted">bonds and futures: from the ticket on the Trade screen</span></div>`;
  if (!W.length) return `<div class="empty"><p>No alerts yet. In the ticket, set a level under ALERT, for example "Z-spread above 90 bp" on a bond you would buy cheaper, or watch a whole segment below.</p></div>` + add;
  const rows = W.map((w, i) => ({ w, i, v: watchVal(w), hit: watchHit(w) })).sort((a, b) => b.hit - a.hit);
  return `<table class="t"><thead><tr><th></th><th>INSTRUMENT</th><th>FIELD</th><th class="n">NOW</th><th class="n">ALERT</th><th></th></tr></thead><tbody>` +
    rows.map(({ w, i, v, hit }) => `<tr ${w.kind !== "idx" ? `class="click" data-pick="${esc(w.id)}" data-kind="${w.kind}"` : ""}><td class="${hit ? "amb" : "muted"}">${hit ? "● HIT" : "○"}</td><td class="nm">${esc(watchName(w))}</td><td class="dim">${WF[w.f]}</td>
      <td class="n">${fmt(v, w.f === "z" || w.f === "idx" ? 1 : 3)}</td><td class="n">${w.op} ${fmt(w.lv, w.f === "z" || w.f === "idx" ? 0 : 3)}</td><td><button class="btn x" data-unwatch="${i}">✕</button></td></tr>`).join("") + `</tbody></table>` + add;
}
function addWatch(w) { state.watch.push(w); store("watch", state.watch); toast(`Alert set: ${watchName(w)} ${WF[w.f]} ${w.op} ${w.lv}`); }
function bindWatch() {
  document.querySelectorAll("[data-unwatch]").forEach(b => b.onclick = e => { e.stopPropagation(); state.watch.splice(+b.dataset.unwatch, 1); store("watch", state.watch); render(); });
  const a = $("#wAdd"); if (a) a.onclick = () => { const lv = Number($("#wLv").value.replace(",", ".")); if (!isFinite(lv) || $("#wLv").value === "") return toast("Enter a level");
    addWatch({ kind: "idx", id: $("#wIdx").value, f: "idx", op: $("#wOp").value, lv }); render(); };
}

// ------------------------------------------------------------------ calendar
function calPanel(bk) {
  const t0 = dParse(DATA.asof).getTime(), t1 = t0 + 90 * DAY, ev = [];
  for (const x of bk.bonds) {
    const b = x.r.b;
    for (const t of couponDates(b)) if (t > t0 && t <= t1) ev.push({ t, w: "Coupon", n: b.name, a: `${b.ccy} ${fmt(x.p.qty * b.cpn / (b.freq || 1) / 100, 0)}` });
    const m = dParse(b.mat).getTime(); if (m > t0 && m <= t1) ev.push({ t: m, w: "Redemption", n: b.name, a: `${b.ccy} ${fmt(x.p.qty, 0)}` });
  }
  for (const x of bk.futs) { const c = x.p.contract || x.r.f.contract, t = c ? dParse(c).getTime() : 0; if (t > t0 && t <= t1) ev.push({ t, w: "Futures expiry", n: `${x.p.code} ${mmmYY(c)}`, a: `${fmtS(x.p.qty, 0)} lots` }); }
  for (const m of DATA.stir?.meetings || []) { const t = dParse(m).getTime(); if (t > t0 && t <= t1) ev.push({ t, w: "ECB meeting", n: "Monetary policy decision", a: DATA.stir.next?.meeting === m ? `${fmtS(DATA.stir.next.bp, 1)} bp priced` : "" }); }
  for (const o of state.orders.filter(o => o.status === "working")) { const t = dParse(o.expires).getTime(); if (t >= t0 && t <= t1) ev.push({ t, w: "Order expires", n: o.kind === "bond" ? (BY_ISIN.get(o.isin)?.name || o.isin) : o.code, a: `limit ${fmt(o.limit, 3)}` }); }
  ev.sort((a, b) => a.t - b.t);
  if (!ev.length) return `<div class="empty">Nothing in the next 90 days.</div>`;
  return `<table class="t"><thead><tr><th>DATE</th><th>EVENT</th><th>WHAT</th><th class="n">AMOUNT</th></tr></thead><tbody>` +
    ev.map(e => `<tr><td>${dTerm(dIso(new Date(e.t)))}</td><td class="${e.w === "ECB meeting" ? "amb" : ""}">${e.w}</td><td class="nm">${esc(e.n)}</td><td class="n">${e.a}</td></tr>`).join("") + `</tbody></table>`;
}

function csv(name, head, rows) {
  const q = (v) => v == null || (typeof v === "number" && !isFinite(v)) ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const blob = new Blob([[head, ...rows].map(r => r.map(q).join(",")).join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ------------------------------------------------------------------ stress tests
// First-order P&L under defined shocks, from the same sensitivities as VaR: rates −DV01 × Δy per bucket (euro by
// Bund-future bucket, dollar by US Treasury bucket), credit −CS01 × Δspread (a bond's spread move in proportion to
// its own spread, as DTS), sovereign shocks on the bonds' DV01, and simple moves for the equity, volatility and
// FX futures. No convexity, no correlation model: each scenario is a what-if, not a probability.
const STRESS = [
  { n: "Rates +100 bp", d: "parallel, euro and dollar", eur: [100, 100, 100, 100], usd: [100, 100, 100, 100] },
  { n: "Rates −100 bp", d: "parallel, euro and dollar", eur: [-100, -100, -100, -100], usd: [-100, -100, -100, -100] },
  { n: "Bear steepener", d: "2Y −25, 5Y −8, 10Y +25, 30Y +30 bp", eur: [-25, -8, 25, 30], usd: [-25, -8, 25, 30] },
  { n: "Bull flattener", d: "2Y +25, 5Y +8, 10Y −25, 30Y −30 bp", eur: [25, 8, -25, -30], usd: [25, 8, -25, -30] },
  { n: "Credit spreads × 1.5", d: "every credit spread widens by half (March 2020 was about × 2)", credit: 0.5 },
  { n: "BTP − Bund +100 bp", d: "Italy +100, Spain/Portugal/Greece +50 bp on government bonds", sov: { IT: 100, ES: 50, PT: 50, GR: 50 } },
  { n: "Risk-off", d: "Bunds −30, USTs −40 bp, credit × 1.5, BTP +100, bank shares −20%, VSTOXX +10, EUR/USD −3%",
    eur: [-30, -30, -30, -30], usd: [-40, -40, -40, -40], credit: 0.5, sov: { IT: 100, ES: 50, PT: 50, GR: 50 }, eq: -0.2, vol: 10, fx: -0.03 },
];
function stressOf(bk, sc) {
  const M = DATA.mkt || {}, idx = DATA.idx || {};
  // spread level of each credit index future's index, for its spread shock (bp)
  const lvl = { FECX: idx.EUR_IG?.z, FGBC: idx.EUR_IG?.z, FEHY: M.BAMLHE00EHYIOAS?.v.at(-1) * 100, FUIG: M.BAMLC0A0CM?.v.at(-1) * 100,
                FUHY: M.BAMLH0A0HYM2?.v.at(-1) * 100, FUEM: M.BAMLH0A0HYM2?.v.at(-1) * 100 };
  let rates = 0, credit = 0, sov = 0, other = 0;
  if (sc.eur) BUCKETS.forEach(([c], i) => { rates -= (bk.buck[c].bonds + bk.buck[c].futs) * sc.eur[i]; });
  if (sc.usd) for (const [k, , lo, , c] of FX_KEYS) {   // dollar shock by tenor; sterling and Swiss franc at their bucket's tenor
    const i = c === "USD" ? FX_BUCKETS.USD.findIndex(([x]) => `USD:${x}` === k) : lo < 6.2 ? 1 : lo < 13 ? 2 : 3;
    rates -= bk.ust[k] * sc.usd[c === "CHF" ? 2 : i];
  }
  for (const x of bk.bonds) {
    if (sc.credit && x.r.cs01) credit -= x.r.cs01 * Math.max(x.r.z ?? 0, 0) * sc.credit;
    const s = sc.sov?.[x.r.b.cty];
    if (s && x.r.b.sector === "SOV" && x.r.b.ccy === "EUR") sov -= x.r.dv01 * s;
  }
  for (const x of bk.futs) {
    const f = x.r.f;
    if (f.type === "credit" && sc.credit && x.r.cs01 && lvl[f.code]) credit -= x.r.cs01 * lvl[f.code] * sc.credit;
    if (f.type === "govt" && sc.sov && f.code === "FBTP") sov -= x.r.notional * 8 * 1e-4 * sc.sov.IT;   // long-term BTP future: duration about 8
    const fx = FXR[f.ccy] || 1;
    if (f.type === "equity" && sc.eq) other += x.p.qty * f.last * sc.eq * f.mult / fx;
    if (f.type === "vol" && sc.vol) other += x.p.qty * sc.vol * f.mult / fx;
    if (f.type === "fx" && sc.fx) other += x.p.qty * f.last * sc.fx * f.mult / fx;
  }
  return { rates, credit, sov, other, tot: rates + credit + sov + other };
}
function stressPanel(bk) {
  if (!bk.ok.length) return `<div class="empty">No positions.</div>`;
  const c = (v) => `<td class="n ${cls(v)}">${Math.abs(v) < 0.5 ? "–" : fmtS(v, 0)}</td>`;
  return `<table class="t"><thead><tr><th>SCENARIO (EUR)</th><th class="n">RATES</th><th class="n">CREDIT</th><th class="n">SOV.</th><th class="n">OTHER</th><th class="n">TOTAL</th></tr></thead><tbody>` +
    STRESS.map(sc => { const r = stressOf(bk, sc); return `<tr title="${esc(sc.d)}"><td>${esc(sc.n)}</td>${c(r.rates)}${c(r.credit)}${c(r.sov)}${c(r.other)}<td class="n ${cls(r.tot)}"><b>${fmtS(r.tot, 0)}</b></td></tr>`; }).join("") +
    `</tbody></table><p class="note pad">Hover a scenario for its shocks. First-order: −DV01 × Δyield by bucket (euro and dollar), −CS01 × spread × the widening (DTS-style), sovereign shocks on euro government bonds by country; OTHER = bank-share, VSTOXX and EUR/USD futures. VaR says how bad a normal bad day is; a stress test asks what a named shock would do.</p>`;
}

function setHedgePct(v) { state.hedgePct = Math.max(0, Math.min(200, v)); store("hedgePct", state.hedgePct); renderRisk(); }

// ------------------------------------------------------------------ MARKETS
// End-of-day monitor from free sources (market.py). ECB, NY Fed: the page re-checks for newer fixings while open.
function miniSpark(v, w = 84, h = 16) {
  const xs = v.slice(-60).filter(x => x != null);
  if (xs.length < 2) return "";
  const lo = Math.min(...xs), hi = Math.max(...xs), r = hi - lo || 1;
  return `<svg class="mini" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${xs.map((x, i) => `${(i / (xs.length - 1) * (w - 2) + 1).toFixed(1)},${(1 + (hi - x) / r * (h - 2)).toFixed(1)}`).join(" ")}"/></svg>`;
}
// change over n observations: bp for rates and spreads (in %), points for indices, % for FX
function chg(s, n) {
  if (!s || s.v.length <= n) return null;
  const a = s.v.at(-1 - n), b = s.v.at(-1);
  return s.unit === "%" ? (b - a) * 100 : s.unit === "" ? (b / a - 1) * 100 : b - a;
}
function derived(a, b, name, unit = "%") {   // spread series a − b on common dates
  const M = DATA.mkt || {};
  if (!M[a] || !M[b]) return null;
  const m = new Map(M[b].d.map((d, i) => [d, M[b].v[i]])), d = [], v = [];
  M[a].d.forEach((x, i) => { if (m.has(x)) { d.push(x); v.push(M[a].v[i] - m.get(x)); } });
  return { name, unit, src: M[a].src, d, v };
}
function mktRows(list) {
  return `<table class="t"><thead><tr><th>INSTRUMENT</th><th class="n">LAST</th><th class="n">1D</th><th class="n">1W</th><th class="n">1M</th><th>60D</th><th>AS OF</th></tr></thead><tbody>` +
    list.map(([s, label, dec = 3]) => {
      if (!s) return `<tr><td>${label}</td><td colspan="6" class="na">unavailable</td></tr>`;
      const c = (n) => { const x = chg(s, n); return `<td class="n ${cls(x)}">${x == null ? "–" : fmtS(x, s.unit === "%" ? 1 : 2)}</td>`; };
      const last = s.v.at(-1);
      return `<tr title="${esc(s.name)} · source ${s.src}"><td>${esc(label || s.name)}</td><td class="n">${s.unit === "%" && /OAS|spread|slope/i.test(label || s.name) ? fmt(last * 100, 0) + " bp" : fmt(last, dec)}</td>${c(1)}${c(5)}${c(21)}<td>${miniSpark(s.v)}</td><td class="dim">${dTerm(s.d.at(-1)).slice(0, 6)} ${s.src}</td></tr>`;
    }).join("") + `</tbody></table>`;
}
function bundBench() {   // Börse Frankfurt: the DBR/OBL/BKO closest to each tenor
  return [2, 5, 10, 30].map(t => {
    let best = null;
    for (const b of BONDS) if (b.sector === "SOV" && b.isin.startsWith("DE000") && /^(DBR|OBL|BKO)\b/.test(b.name) && b.firm && (!best || Math.abs(b.yrs - t) < Math.abs(best.yrs - t))) best = b;
    return best ? `<tr class="click" data-pick="${best.isin}" data-kind="bond"><td>${t}Y</td><td class="nm">${esc(best.name)}</td><td class="n">${fmt(best.ytm, 3)}</td><td class="n">${fmt(best.z, 0)}</td></tr>` : "";
  }).join("");
}
async function refreshLive() {   // newer ECB / NY Fed fixings than the build, fetched from the browser
  const M = DATA.mkt || (DATA.mkt = {}), upd = (k, d, v) => { const s = M[k]; if (!s) return; d.forEach((x, i) => { if (x > s.d.at(-1)) { s.d.push(x); s.v.push(v[i]); } }); };
  const ecb = async (key) => { const t = await (await fetch(`https://data-api.ecb.europa.eu/service/data/${key}?format=csvdata&lastNObservations=5`)).text();
    const rows = t.trim().split("\n"), h = rows[0].split(","), id = h.indexOf("TIME_PERIOD"), iv = h.indexOf("OBS_VALUE");
    const r = rows.slice(1).map(x => x.split(",")).filter(x => x[iv]); return [r.map(x => x[id]), r.map(x => +x[iv])]; };
  try { upd("EURUSD", ...await ecb("EXR/D.USD.EUR.SP00.A")); } catch {}
  try { upd("ESTR", ...await ecb("EST/B.EU000A2X2A25.WT")); } catch {}
  try { const j = (await (await fetch("https://markets.newyorkfed.org/api/rates/secured/sofr/last/5.json")).json()).refRates.reverse(); upd("SOFR", j.map(x => x.effectiveDate), j.map(x => +x.percentRate)); } catch {}
  state.liveAt = new Date();
  if (["rates", "ecb", "credit", "global"].includes(state.view)) render();

    S.euribor.map(q => `<tr${q.trades < 5 ? ` class="muted" title="few trades: the price may be stale"` : ""}><td>${mmmYY(q.contract)}${q.quarterly ? "" : ` <span class="muted">serial</span>`}</td><td class="n" title="deposit from ${dTerm(q.start)} · future ${fmt(q.price, 3)}">${pct(q.rate)}</td><td class="n">${q.basis == null ? "–" : fmt(q.basis, 1)}</td>${chg(q.d1)}${chg(q.w1)}<td class="n">${fmt(q.trades, 0)}</td></tr>`).join("") + `</tbody></table>`;

function addMonthsIso(iso, n) { const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 10); }
function stirChart(S, w, h = 260) {
  const L = 44, R = 12, T = 10, B = 28, t = (iso) => new Date(iso + "T12:00:00").getTime();

  const X = (ms) => L + (ms - x0) / (x1 - x0) * (w - L - R), Y = (v) => T + (v1 - v) / (v1 - v0) * (h - T - B);
  let g = "";

  const d0 = new Date(x0); for (let y = d0.getFullYear(); ; y++) { const ms = new Date(`${y}-01-01T12:00:00`).getTime(); if (ms > x1) break; if (ms > x0) g += `<line class="grid" x1="${X(ms)}" x2="${X(ms)}" y1="${T}" y2="${h - B}"/><text x="${X(ms)}" y="${h - 14}" text-anchor="middle">${y}</text>`; }
  const mt = S.meetings.filter(m => t(m) <= x1).map(m => `<line class="mtg" x1="${X(t(m))}" x2="${X(t(m))}" y1="${h - B}" y2="${h - B + 5}"><title>ECB meeting ${dTerm(m)}</title></line>`).join("");
  const now = (v, lbl, below) => v == null ? "" : `<line class="now" x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${w - R - 2}" y="${Y(v) + (below ? 11 : -3)}" text-anchor="end">${lbl} ${fmt(v, 3)}</text>`;
  const path = qs.map((q, i) => { const a = Math.max(x0, t(q.start)), b = t(q.end); return `${i ? "L" : "M"}${X(a).toFixed(1)},${Y(q.dfr).toFixed(1)}L${X(b).toFixed(1)},${Y(q.dfr).toFixed(1)}`; }).join("");
  const dots = eu.filter(q => t(q.start) <= x1).map(q => `<circle class="eur" cx="${X(Math.max(x0, t(q.start))).toFixed(1)}" cy="${Y(q.rate).toFixed(1)}" r="${q.quarterly ? 3.5 : 2.2}"><title>3M Euribor from ${dTerm(q.start)}: ${fmt(q.rate, 3)}% (${q.trades} trades)</title></circle>`).join("");

    const opened = (p.date || (p.at || "").slice(0, 10)) >= w.mon;
    let base = opened ? p.price : null;
    if (base == null && w.base) {
      const h = await histOf(p.kind === "bond" ? p.isin : "FUT:" + p.code);
      base = h?.find(x => x.d === w.base)?.v?.[0] ?? null;
    }
    if (base == null) continue;
    const pnl = p.kind === "bond" ? p.qty * (r.now - base) / 100 : p.qty * (r.now - base) * r.f.mult;
    rows.push({ l: p.kind === "bond" ? r.b.name : `${p.code} ${mmmYY(r.f.contract)}`, v: pnl });
  }
  rows.sort((a, b) => b.v - a.v);
  const tot = rows.reduce((s, x) => s + x.v, 0);
  return `<dl class="kv"><dt>Week P&amp;L (clean)</dt><dd class="big ${cls(tot)}">${rows.length ? fmtS(tot, 0) + " EUR" : "–"}</dd><dt>Realized this week</dt><dd class="${cls(realW)}">${closedW.length ? fmtS(realW, 0) + " EUR" : "–"}</dd><dt>Trades this week</dt><dd>${trades.length}</dd>
    ${rows.length ? `<dt>Best</dt><dd class="pos">${esc(rows[0].l)} ${fmtS(rows[0].v, 0)}</dd><dt>Worst</dt><dd class="${cls(rows.at(-1).v)}">${esc(rows.at(-1).l)} ${fmtS(rows.at(-1).v, 0)}</dd>` : ""}</dl>
    ${rows.length ? "" : `<p class="note">${state.positions.length ? "Positions held before this week need a base day in the history." : "No positions."}</p>`}
    ${trades.length ? `<table class="t"><tbody>${trades.slice(-8).reverse().map(p => `<tr><td class="dim">${esc((p.at || "").slice(5, 10))}</td><td>${esc(describe(p))}</td><td class="who">${esc(p.by || "")}</td></tr>`).join("")}</tbody></table>` : ""}`;
}

  ["Roll-down", "Price gain from the bond ageing along an unchanged curve (3 months shown)."],

function numPred(t) {
  const parts = t.replace(/,/g, ".").replace(/−/g, "-").trim().split(/\s+(?=[<>=])|\s*&\s*/).filter(Boolean), tests = [];
  const N = "(-?\\d*\\.?\\d+)";
  for (const x of parts) {
    let m = x.match(new RegExp(`^${N}\\s*(?:\\.\\.|–|-|to)\\s*${N}$`));
    if (m) { const lo = Math.min(+m[1], +m[2]), hi = Math.max(+m[1], +m[2]); tests.push(v => v >= lo && v <= hi); continue; }
    m = x.match(new RegExp(`^(>=|<=|>|<|=)?\\s*${N}$`));
    if (!m) return null;
    const c = +m[2], d = (m[2].split(".")[1] || "").length;
    tests.push({ ">": v => v > c, "<": v => v < c, ">=": v => v >= c, "<=": v => v <= c }[m[1]] || (v => Math.abs(v - c) < 0.5 * 10 ** -d + 1e-9));
  }
  return tests.length ? v => v != null && isFinite(v) && tests.every(f => f(v)) : null;
}

    const val = CF_VAL[k] || (b => b[k]);
    if (CF_TEXT.has(k)) { const q = t.trim().toLowerCase(); out.push(b => String(val(b)).toLowerCase().includes(q)); continue; }
    const f = numPred(t); if (f) out.push(b => f(val(b)));
  }
  return out;
}

        <div class="atabs" id="atabs" role="tablist" aria-label="Asset class">${TABS.map(t => `<button role="tab" data-tab="${t.k}" title="${t.t}">${t.l}<span class="ct"></span></button>`).join("")}
          <span class="chips ccy" id="ccyf" aria-label="Currency">${["EUR", "USD", "GBP", "CHF"].filter(c => c === "EUR" || BONDS.some(b => b.ccy === c)).map(c => `<button data-c="${c}" title="Spreads over the ${CURVE_NAME[c]} curve">${c}</button>`).join("")}</span></div>

          <div class="chips" id="mat" aria-label="Maturity">${[["all", "ALL"], ["0-3", "0-3Y"], ["3-7", "3-7Y"], ["7-15", "7-15Y"], ["15+", "15Y+"]].map(([k, l]) => `<button data-m="${k}">${l}</button>`).join("")}</div>
          <button class="tog" id="bench" title="Issue size at least EUR 500m, senior (no subordinated, hybrid or perpetual)">BENCHMARK ≥€500M SENIOR</button>

        </div>

      `<div class="panel" style="grid-area:fut"><div class="ph"><h2>Eurex futures</h2><span class="sub">last on-book trade ${dTerm(DATA.asof)}, not the official settlement price</span></div><div class="pb" id="futBody"></div></div>` +
      `<div class="panel" style="grid-area:tkt"><div class="ph"><h2>Trade ticket</h2><span class="sub" id="tktSub"></span></div><div class="pb" id="tktBody"></div></div>`;
    $("#atabs").onclick = e => { const k = e.target.closest("button")?.dataset.tab; if (k) setTab(k); };

    $("#firm").onclick = () => { state.firm = !state.firm; store("firm", state.firm); renderScreener(true); };
    $("#esgf").onclick = () => { state.esgOnly = !state.esgOnly; store("esgOnly", state.esgOnly); renderScreener(true); };

    $("#typef").onclick = e => { const k = e.target.closest("button")?.dataset.t; if (!k) return; state.typeOff.has(k) ? state.typeOff.delete(k) : state.typeOff.add(k); store("typeOff", [...state.typeOff]); renderScreener(true); };
